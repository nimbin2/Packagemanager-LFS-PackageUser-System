# backup.conf -- read by `lfs-backup`.  What to carry to the next system.
#
# One path per line.  Globs are fine.  A directory takes every file below it.
# A symlink is backed up as the file it points to.
#   [user:NAME]    ~ is the main user's home  (PKGUSR_SYS_MAIN_USER)
#   [root:NAME]    ~ is root's home
#   [system:NAME]  absolute paths
# NAME is what you pick with --only / --skip:
#   lfs-backup sections                         the names, with file counts
#   lfs-backup restore <archive> --skip accounts,ssh
#
# A line starting with ! leaves out whatever matches it, in every section
# (* crosses /).
#
#   lfs-backup list                  what this resolves to, right now
#   lfs-backup create --run          the archive (in /root, mode 600)
#   lfs-backup restore <archive>     the plan on the new system; add --run
#   lfs-backup merge <archive>       go through the .new files one by one
#   lfs-backup clean <archive>       remove the .new files once merged
#   lfs-backup plan <archive> [file] a restore plan to edit: skip files, or
#                                    give them another target; then
#                                    lfs-backup restore <archive> --plan <file>

# ---- left out everywhere ---------------------------------------------------
# plugin git histories (ALE's pack alone is 20 MB) and their test trees: the
# plugin runs without them, and `git clone` gets them back
!~/.vim/pack/*/.git/*
!~/.vim/pack/*/test/*
# editor backups and history
!*~
!~/.vim/.netrwhist

[user:shell]
~/.bash_profile
~/.bashrc
~/.profile
~/.bash_aliases

[user:desktop]
~/.config/sway/config
~/.config/foot/foot.ini
~/.config/swas/config
~/.config/swbr/config
~/.config/swov/config
~/.config/mpv/mpv.conf

# ~/.vim holds the plugins (pack/, autoload/, plugin/ ...): all of it
[user:vim]
~/.vimrc
~/.vim

[user:git]
~/.gitconfig

# private keys: secrets, like everything in the archive
[user:ssh]
~/.ssh/config
~/.ssh/authorized_keys
~/.ssh/id_*

[root:shell]
~/.profile
~/.bash_profile
~/.bashrc
~/.bash_aliases

[root:vim]
~/.vimrc
~/.vim

# ---------------------------------------------------------------------------
# BOOT SCRIPTS: NOT ALL OF /etc/rc.d.  init.d/* comes from the bootscript
# packages and rc?.d/ are their start links -- a new system installs both,
# and backing them up only yields a .new for every changed upstream script.
# Carry what YOU wrote or edited.
[system:boot]
/etc/fstab
/etc/inittab
/etc/sysconfig/rc.site
/etc/sysconfig/clock
/etc/sysconfig/console
/etc/rc.d/rc.iptables
/etc/rc.d/rc.ip6tables
/boot/efi/EFI/refind/refind.conf
/etc/sysctl.conf
/etc/modprobe.d/*.conf
/etc/cron.weekly/update-pki.sh
# written by `cfg power`; carried so a hand edit is not lost
/etc/rc.d/init.d/power-perms

[system:network]
/etc/hostname
/etc/hosts
/etc/resolv.conf
/etc/sysconfig/ifconfig.wlp3s0
/etc/sysconfig/wpa_supplicant/*

[system:udev]
/etc/udev/rules.d/*.rules

[system:tools]
/etc/pkgusr/kernel.conf
/etc/pkgusr/backup.conf
/etc/pkgusr/desktop-user
/etc/pkgusr/stacks/machine.conf
/etc/pkgusr/stacks/package-fixes.conf
/etc/pkgusr/stacks/app-users.conf
/etc/pkgusr/packagemanager.conf

[system:shell]
/etc/profile
/etc/inputrc

# the global vimrc.  /usr/share/vim/vimfiles is NOT taken: what is in it
# belongs to packages (cmake's syntax files were all it held) and comes back
# with them.
[system:vim]
/etc/vimrc

# ALWAYS restored as .new, to merge by hand.  shadow alone is useless
# without the passwd and group lines it belongs to.
[system:accounts]
/etc/passwd
/etc/group
/etc/shadow
/etc/gshadow

# host keys keep this machine's SSH identity; they are secrets
[system:ssh]
/etc/ssh/sshd_config
/etc/ssh/ssh_host_*_key
/etc/ssh/ssh_host_*_key.pub
