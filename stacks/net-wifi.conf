# net-wifi.conf -- read by `cfg net-wifi`.
#
#     packagemanager stack network --only net-wifi --run
#
# The step REPORTS what a wireless link still needs, and -- with WRITE=yes --
# writes the parts that hold no secret.  It never touches a file it did not
# write: a config of yours is reported, never edited.
#
# WHAT IT WILL NOT WRITE: the wpa_supplicant configuration, because that one
# holds your passphrase.  It prints the two commands that make it.

# WRITE: write /etc/sysconfig/ifconfig.<iface> for every wireless interface
# that has none.  That file names the interface, the service and the DHCP
# client -- no SSID, no key.
WRITE=yes

# PREFER: interface names, best first; shell patterns are allowed.  The first
# one that EXISTS gets the low route metric, so while it is plugged in the
# machine uses it and falls back to the next when it is gone.  Leave empty to
# let dhcpcd decide.
#
# An external antenna usually beats the card inside the lid, which is why
# the USB name comes first here.
PREFER="wl-ext wlan*"
METRIC_PREFERRED=100
METRIC_OTHER=300

# A USB ADAPTER'S NAME DEPENDS ON THE PORT IT IS IN.
#
# udev names it from where it sits on the bus -- wlp7s0f4u2 in one socket,
# something else in the next -- and an ifconfig.<name> file cannot follow
# that.  USB_RENAME writes a udev rule that names this adapter by its USB
# ids instead, so the name is the same in every port.
#
# The ids are the ones dmesg prints when you plug it in:
#     usb 6-2: New USB device found, idVendor=0cf3, idProduct=9271
# (0cf3:9271 is the Atheros AR9271 -- TL-WN722N v1, Alfa AWUS036NHA, UB91C.)
# USB_NAME must NOT be wlanN: that is the kernel's own namespace and udev
# refuses to rename into it.
USB_RENAME=yes
USB_VENDOR=0cf3
USB_PRODUCT=9271
USB_NAME=wl-ext

# DISABLE_MISSING: a config file for an interface this kernel does not have
# makes the boot print
#     Bringing up the eth0 interface... Interface eth0 doesn't exist. FAIL
# yes sets ONBOOT="no" in those files (backed up first) so the boot stops
# trying.  Nothing is ever deleted: the card may be back tomorrow, and
# `ifup <iface>` still brings it up by hand.
#
# Leave it at no if you unplug a USB adapter often and would rather have it
# come up automatically the moment it is there at boot.
DISABLE_MISSING=no

# COPY_WPA: when a new interface has no wpa_supplicant config and another
# interface on this machine has one, copy it (chmod 600).  Same machine, same
# networks, your own key -- it is a copy, and the step says so every time.
# An existing file is never overwritten.
COPY_WPA=yes
